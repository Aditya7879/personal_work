<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Quality Console</title>
    <meta name="description" content="Enterprise console for evaluating agent quality, triage feedback, curating golden datasets, and release gating." />
    <meta property="og:title" content="Agent Quality Console" />
    <meta property="og:description" content="Enterprise console for evaluating agent quality, triage feedback, curating golden datasets, and release gating." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        const savedTheme = localStorage.getItem('agent-quality-theme');
        const darkMode = savedTheme === 'dark' || (savedTheme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (darkMode) document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = darkMode ? 'dark' : 'light';
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
